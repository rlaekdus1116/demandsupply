<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>치킨 시장 - 수요와 공급</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap');
  :root{
    --bg:#eef6e6; --card:#ffffff; --ink:#16340f; --sub:#5f7357;
    --brand:#f5821f; --brand2:#e06a00; --demand:#2563eb; --supply:#dc2626;
    --ok:#16a34a; --bad:#dc2626; --line:#dbe9cf; --soft:#fff3e2;
    --green:#39a845; --green2:#2c8a37; --pink:#e8489a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;}
  .wrap{max-width:1100px;margin:0 auto;padding:18px;}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 10px 30px rgba(234,88,12,.08);padding:26px;}
  h1{font-size:26px;margin:0 0 6px;} h2{font-size:20px;margin:0 0 12px;}
  .muted{color:var(--sub);} .logo{font-size:40px;}
  .btn{border:none;border-radius:14px;padding:16px 22px;font-size:18px;font-weight:800;cursor:pointer;transition:.12s transform,.12s filter;}
  .btn:active{transform:translateY(1px)} .btn-brand{background:var(--brand);color:#fff}
  .btn-brand:hover{filter:brightness(1.05)} .btn-ghost{background:var(--soft);color:var(--brand2)}
  .btn-dark{background:#111827;color:#fff} .btn-ok{background:var(--ok);color:#fff}
  .btn-big{width:100%;padding:24px;font-size:22px;border-radius:18px}
  .btn-sm{padding:8px 14px;font-size:14px;border-radius:10px}
  .row{display:flex;gap:12px;flex-wrap:wrap} .grow{flex:1}
  input,select,textarea{font-size:18px;padding:14px;border:2px solid var(--line);border-radius:12px;width:100%;font-family:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
  label{font-weight:700;font-size:14px;color:var(--sub);display:block;margin-bottom:6px}
  .pin{font-size:60px;font-weight:900;letter-spacing:10px;color:var(--brand2);text-align:center;background:var(--soft);border-radius:16px;padding:16px 8px;margin:8px 0}
  .pill{display:inline-block;background:var(--soft);color:var(--brand2);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tally{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:16px 0}
  .tbox{border-radius:16px;padding:18px;text-align:center}
  .tbox .n{font-size:52px;font-weight:900;line-height:1} .tbox .l{font-weight:800;margin-top:6px}
  .t-yes{background:#e7f6ec;color:var(--ok)} .t-no{background:#fdeaea;color:var(--supply)} .t-wait{background:#f3f4f6;color:var(--sub)}
  .price-big{font-size:60px;font-weight:900;color:var(--brand2);text-align:center;margin:10px 0}
  .students{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{background:var(--soft);border-radius:999px;padding:8px 14px;font-weight:700}
  .stepbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
  .stepbar .prog{height:10px;background:var(--line);border-radius:999px;flex:1;overflow:hidden}
  .stepbar .prog>i{display:block;height:100%;background:var(--brand);transition:.3s width}
  .nav{display:flex;gap:12px;margin-top:20px}
  .blank{display:inline-block;min-width:90px;text-align:center;border-bottom:3px solid var(--brand);color:var(--brand2);font-weight:900}
  .sentence{font-size:24px;line-height:2;background:var(--soft);border-radius:16px;padding:20px;margin:10px 0}
  .hidden{display:none!important}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111827;color:#fff;padding:14px 22px;border-radius:999px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:50}
  .look{font-size:22px;text-align:center;color:var(--sub);padding:36px 10px}
  .look .emoji{font-size:60px;display:block;margin-bottom:12px}
  .cardtag{position:fixed;top:12px;right:12px;font-size:12px;background:#111827;color:#fff;padding:6px 12px;border-radius:999px;z-index:40;opacity:.85}
  a{color:var(--brand2)}
  .warn{background:#fff4e5;border:1px solid #ffd8a8;border-radius:12px;padding:14px;color:#9a5b00;font-size:14px}
  canvas{max-width:100%}
  .std{background:var(--soft);border-radius:14px;padding:16px 18px;margin:10px 0;font-size:17px;line-height:1.6} .std b{color:var(--brand2)}
  .gamecard{border-radius:18px;padding:20px;text-align:center;color:#fff;margin:10px 0}
  .gc-buy{background:linear-gradient(135deg,#2563eb,#1d4ed8)} .gc-sell{background:linear-gradient(135deg,#dc2626,#b91c1c)}
  .gamecard .role{font-size:18px;font-weight:800;opacity:.95} .gamecard .val{font-size:42px;font-weight:900;margin:6px 0} .gamecard .hint{font-size:14px;opacity:.95}
  .fb{border-radius:14px;padding:14px;font-weight:800;text-align:center;margin-top:12px;font-size:18px}
  .fb-ok{background:#e7f6ec;color:var(--ok)} .fb-bad{background:#fdeaea;color:var(--bad)}
  .hist{display:flex;align-items:flex-end;gap:10px;height:220px;margin:16px 0;padding:0 6px}
  .hist .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
  .hist .col .bar{width:100%;border-radius:8px 8px 0 0;background:var(--brand);transition:.3s height;min-height:2px}
  .hist .col.peak .bar{background:var(--ok)} .hist .col .cnt{font-weight:800} .hist .col .px{font-size:12px;color:var(--sub);white-space:nowrap}
  .resp-list{max-height:340px;overflow:auto;margin-top:10px}
  .resp{background:var(--soft);border-radius:12px;padding:10px 14px;margin:6px 0} .resp b{color:var(--brand2)}
  .book{border:2px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
  .offer{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
  .offer .op{font-weight:900;font-size:18px} .offer .om{font-size:13px;color:var(--sub);flex:1}
  .offer.buy{border-left:5px solid var(--demand)} .offer.sell{border-left:5px solid var(--supply)}
  .req{background:#fff7ed;border:1px solid #ffd8a8;border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;align-items:center;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;justify-content:center}
  .chipbtn{background:#fff;border:2px solid var(--brand);color:var(--brand2);border-radius:999px;padding:10px 18px;font-weight:800;font-size:18px;cursor:pointer}
  .chipbtn.used{opacity:.3;pointer-events:none}
  .slot{display:inline-block;min-width:100px;padding:6px 10px;margin:0 3px;border-bottom:3px dashed var(--brand);color:var(--brand2);font-weight:900;text-align:center;cursor:pointer}
  .slot.empty{color:#cbb9a3}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}.price-big{font-size:48px}.pin{font-size:44px}}

  /* ===== 시장 가격 탐구소 (임베드 · #iqRoot 로 스코프) ===== */
  #iqRoot .iqtop{margin-bottom:12px}
  #iqRoot .iqbar{height:10px;background:#f1e3d3;border-radius:99px;overflow:hidden}
  #iqRoot .iqbar>i{display:block;height:100%;background:linear-gradient(90deg,#f97316,#fb923c);border-radius:99px;transition:.3s}
  #iqRoot .iqstep{font-size:14px;color:var(--sub);margin-top:6px;font-weight:800}
  #iqRoot .panel{display:none} #iqRoot .panel.show{display:block;animation:iqf .25s}
  @keyframes iqf{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #iqRoot .big{font-size:22px;font-weight:900;margin:0 0 4px}
  #iqRoot .say{font-size:15px;color:var(--sub);margin:0 0 14px}
  #iqRoot .write{background:var(--soft);border:2px solid #ffd8a8;border-radius:14px;padding:14px;margin:10px 0}
  #iqRoot .write .q{font-weight:800;font-size:15px;margin-bottom:8px}
  #iqRoot .write input,#iqRoot .write textarea,#iqRoot .write select{width:100%;border:2px solid #f0d9b5;border-radius:12px;padding:12px;font-size:16px;font-family:inherit;background:#fff}
  #iqRoot .write textarea{min-height:80px;resize:vertical}
  #iqRoot .hypo{background:#eef4ff;border-radius:14px;padding:16px;font-size:19px;font-weight:800;text-align:center;color:#1d4ed8;line-height:1.6}
  #iqRoot select.blank{display:inline-block;width:auto;min-width:80px;font-weight:800;font-size:16px;padding:6px 8px;border-radius:10px;border:2px solid #2563eb;background:#fff;color:#1d4ed8;margin:2px}
  #iqRoot .grp-title{font-weight:800;font-size:15px;margin:14px 0 8px;display:flex;align-items:center;gap:7px}
  #iqRoot .dot{width:12px;height:12px;border-radius:50%} #iqRoot .dot.d{background:#e11d48} #iqRoot .dot.s{background:#0d9488}
  #iqRoot .picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #iqRoot .pick{position:relative;border:2px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;background:#fff;font-weight:800;font-size:14px;user-select:none}
  #iqRoot .pick .ic{font-size:28px;display:block;margin-bottom:4px}
  #iqRoot .pick.on{border-color:var(--brand);background:var(--soft)}
  #iqRoot .pick.on::after{content:"✓";position:absolute;top:6px;right:9px;color:#fff;background:var(--brand);width:20px;height:20px;border-radius:50%;font-size:13px;line-height:20px;font-weight:900}
  #iqRoot .tip{background:#f2f5ff;border-radius:12px;padding:12px 14px;font-size:14px;color:#3b4664;margin:6px 0}
  #iqRoot .news-box{background:#f8fafc;border:2px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
  #iqRoot .news-box h4{margin:0 0 8px;font-size:16px;display:flex;gap:6px;align-items:center}
  #iqRoot .news-box .summary{font-size:14px;color:#475569;line-height:1.6}
  #iqRoot .none{background:#fff4e5;border-radius:12px;padding:14px;text-align:center;color:#8a5a12;font-weight:800}
  #iqRoot .toggle{margin:10px 0} #iqRoot .toggle .lab{font-weight:800;font-size:16px;margin-bottom:8px}
  #iqRoot .seg{display:flex;gap:8px}
  #iqRoot .seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 4px;font-size:14px;font-weight:800;cursor:pointer;color:var(--sub);transition:.2s}
  #iqRoot .seg.d button.on{background:#e11d48;border-color:#e11d48;color:#fff}
  #iqRoot .seg.s button.on{background:#0d9488;border-color:#0d9488;color:#fff}
  #iqRoot .result{margin-top:14px;background:#0f172a;color:#fff;border-radius:16px;padding:20px;text-align:center}
  #iqRoot .result .price{font-size:28px;font-weight:900;margin:4px 0;transition:color .3s}
  #iqRoot .result .sub{font-size:14px;opacity:.85}
  #iqRoot #gLineD,#iqRoot #gLineS,#iqRoot #gEqPt,#iqRoot #gEqX,#iqRoot #gEqY,#iqRoot #gTextD,#iqRoot #gTextS{transition:all .4s cubic-bezier(.4,0,.2,1)}
  #iqRoot .compare{background:#f2f5ff;border-radius:12px;padding:12px;margin:8px 0;font-size:15px} #iqRoot .compare b{color:#1d4ed8}
  #iqRoot .verdict{border-radius:12px;padding:14px;font-size:16px;font-weight:800;text-align:center;margin:10px 0}
  #iqRoot .verdict.match{background:#dcfce7;color:#166534} #iqRoot .verdict.diff{background:#fef9c3;color:#854d0e}
  #iqRoot .roles{display:flex;gap:8px;margin-bottom:6px}
  #iqRoot .roles button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 4px;font-size:14px;font-weight:800;cursor:pointer;color:var(--sub)}
  #iqRoot .roles button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ===== 菜市场 마켓가이드 스타일 (디자인 전용 · 로직/구조 변경 없음) ===== */
  body::before,body::after{content:"";position:fixed;left:0;right:0;height:16px;z-index:60;pointer-events:none;
    background:conic-gradient(var(--green) 90deg,#fff 0 180deg,var(--green) 0 270deg,#fff 0) 0 0/16px 16px;}
  body::before{top:0} body::after{bottom:0}
  .wrap{padding-top:24px}
  h1,h2{font-family:'Black Han Sans','Jua',sans-serif;letter-spacing:-.5px;color:var(--ink)}
  h1{transform:rotate(-1.2deg);display:inline-block;text-shadow:3px 3px 0 rgba(57,168,69,.28)}
  .logo{filter:drop-shadow(2px 3px 0 rgba(57,168,69,.35))}
  .card{border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(22,52,15,.14)}
  .pill{background:var(--green);color:#fff;border:2px solid var(--ink);font-family:'Jua',sans-serif}
  .btn{font-family:'Jua','Black Han Sans',sans-serif;border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(22,52,15,.20)}
  .btn:active{box-shadow:1px 1px 0 rgba(22,52,15,.20)}
  .btn-brand{background:var(--brand);color:#fff}
  .btn-ok{background:var(--green);color:#fff}
  .btn-ghost{background:#fff;color:var(--green2)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-sm{border-width:2px;box-shadow:2px 2px 0 rgba(22,52,15,.18)}
  .price-big{font-family:'Black Han Sans',sans-serif;text-shadow:2px 2px 0 rgba(57,168,69,.22)}
  .pin{font-family:'Black Han Sans',sans-serif;background:#fff;border:3px dashed var(--green)}
  .stepbar .prog{border:2px solid var(--ink)} .stepbar .prog>i{background:linear-gradient(90deg,var(--green),var(--brand))}
  .chip{background:#fff;border:2px solid var(--green);color:var(--green2);font-weight:800}
  .std{border-left:6px solid var(--green)}
  .sentence{border:2px dashed var(--green)}
  .tbox{border:2px solid var(--ink)}
  .gamecard{border:3px solid var(--ink);box-shadow:5px 5px 0 rgba(22,52,15,.2)}
  .hist .col .bar{background:var(--brand)} .hist .col.peak .bar{background:var(--green)}
  .blank{border-color:var(--brand)}
  #iqRoot .card{border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(22,52,15,.14)}
  #iqRoot .big{font-family:'Black Han Sans','Jua',sans-serif}
  #iqRoot .btn{border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(22,52,15,.20)}
  #iqRoot .pick.on{border-color:var(--brand)}
</style>
</head>
<body>
<div id="app"></div>
<div id="tag" class="cardtag hidden"></div>
<div id="toast" class="toast hidden"></div>
<button id="bgmBtn" onclick="bgmToggle()" style="position:fixed;left:12px;bottom:12px;z-index:60;background:#fff;border:2px solid #16340f;border-radius:999px;padding:8px 14px;font-weight:800;font-family:'Jua',sans-serif;cursor:pointer;box-shadow:2px 2px 0 rgba(22,52,15,.2)">🎵 음악</button>

<script>
/* =========================================================================
   치킨 시장 — 수요와 공급 실시간 수업 웹앱 (모의 시장 호가창 P2P)
   ========================================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyChEuuawdgNznSb8FzByP98GhTEzq_hAdo",
  authDomain: "demandsupply-b961c.firebaseapp.com",
  databaseURL: "https://demandsupply-b961c-default-rtdb.firebaseio.com",
  projectId: "demandsupply-b961c",
  storageBucket: "demandsupply-b961c.firebasestorage.app",
  messagingSenderId: "475624406832",
  appId: "1:475624406832:web:cef84e906a88aa574d12f5",
  measurementId: "G-5LCN6XJVX6"
};
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwtAd0TjxyXfWLn0u5GbONU3bddBn-iKS8Wl9Hj3tg4KNcQ4peAfuDpoxMi19ujSZK9/exec";

const PRICES = [5000, 15000, 30000, 50000, 70000];
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';

const BUYER_POOL  = [9000, 10000, 11000, 12000, 13000];  // 구매자 만족 가치
const SELLER_POOL = [4000, 5000, 6000, 7000, 8000];      // 판매자 원가
const MKT_UNIT = 1000;
const MAX_ROUND = 3;
const ROUND_SECONDS = 90;   // 라운드당 제한시간

const SCREENS = [
  {t:'lobby'},
  {t:'standards'},
  {t:'demand_intro'},
  ...PRICES.map(p=>({t:'demand_price', price:p})),
  {t:'demand_curve'},
  {t:'demand_written'},
  {t:'supply_intro'},
  ...PRICES.map(p=>({t:'supply_price', price:p})),
  {t:'supply_curve'},
  {t:'supply_written'},
  {t:'price_who'},        // 5. 가격은 누가 결정?
  {t:'market_intro'},     // 6. 역할·카드 배부
  {t:'market_trade'},     // 6. 호가창 거래 (3라운드)
  {t:'market_result'},    // 6. 전체 거래 결과표 (빈도 그래프)
  {t:'price_who2'},       // 데이터 보고 다시: 시장 가격은 누가?
  {t:'price_explain'},    // 설명: 수요·공급이 만나는 점에서 결정
  {t:'eq_written'},       // 7. 균형 서술형
  {t:'standards2'},       // 성취기준 재언급 (다음 미션 브리지)
  {t:'shift_intro'},      // 개념 설명: 가격변동(수요량 변화) vs 가격외 요인(수요·공급 자체 변화)
  {t:'inquiry'},          // 8·9. 시장 가격 탐구소 (변동 예측·대응, 자기 속도)
  {t:'summarize_build'},  // 11. 문장 완성 (조각 채우기)
  {t:'end'}
];

let db=null, role=null, pin=null, sid=null, sname=null;
let roomRef=null, liveData={}, chart=null;
let sbScreen=null, sbSlots=[], sbChips=[];   // 문장완성 상태
let lastTeacherIdx=-1, shownLine={}, shownAns={}, iqPick=null;   // 교사: 곡선 잇기·정답 공개·탐구소 학생 상세
function toggleLine(t){ shownLine[t]=!shownLine[t]; renderCurrent(); }
function revealAns(t){ shownAns[t]=!shownAns[t]; renderCurrent(); }

sid = sessionStorage.getItem('cm_sid');
if(!sid){ sid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); sessionStorage.setItem('cm_sid', sid); }

const $ = s => document.querySelector(s);
const app = $('#app');
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add('hidden'),1700); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nameOf(id){ if(id==='TEACHER') return '👩‍🏫 선생님'; return ((liveData.students||{})[id]||{}).name || '학생'; }

function getConfig(){ const s=localStorage.getItem('cm_fbconfig'); if(s){try{return JSON.parse(s);}catch(e){}} return FIREBASE_CONFIG; }
function getSheetUrl(){ return localStorage.getItem('cm_sheeturl') || SHEET_URL; }
function isConfigured(cfg){ return cfg && cfg.databaseURL && !cfg.databaseURL.includes('PASTE_YOUR'); }
function initFirebase(){ const cfg=getConfig(); if(!isConfigured(cfg)) return false; if(!firebase.apps.length) firebase.initializeApp(cfg); db=firebase.database(); return true; }

function subscribeAll(){
  roomRef.child('screenIndex').on('value', s=>{ liveData.screenIndex=s.val()||0; renderCurrent(); });
  roomRef.child('students').on('value', s=>{ liveData.students=s.val()||{}; renderCurrent(); });
  roomRef.child('responses').on('value', s=>{ liveData.responses=s.val()||{}; renderCurrent(); });
  roomRef.child('market').on('value', s=>{ liveData.market=s.val()||{};
    const dc=Object.keys((liveData.market.deals)||{}).length;
    if(role==='teacher' && prevDealCount>=0 && dc>prevDealCount) speak('체결되었습니다');
    prevDealCount=dc; renderCurrent(); });
  roomRef.child('text').on('value', s=>{ liveData.text=s.val()||{}; renderCurrent(); });
}

/* ---------------- 랜딩/설정 ---------------- */
function renderLanding(){

/* ---------------- 집계 & 곡선 ---------------- */
function respNode(kind){ return (liveData.responses||{})[kind]||{}; }
function rawCounts(kind){ const data=respNode(kind), out={}; PRICES.forEach(p=>{ const at=data[p]||{}; let yes=0,no=0; Object.values(at).forEach(v=>v?yes++:no++); out[p]={yes,no}; }); return out; }
function correctedDemand(){ const data=respNode('demand'), m={}; PRICES.forEach(p=>{ const at=data[p]||{}; Object.entries(at).forEach(([u,v])=>{ if(v) m[u]=Math.max(m[u]||0,p); }); }); return PRICES.map(p=>Object.values(m).filter(w=>w>=p).length); }
function correctedSupply(){ const data=respNode('supply'), m={}; PRICES.forEach(p=>{ const at=data[p]||{}; Object.entries(at).forEach(([u,v])=>{ if(v) m[u]=Math.min(m[u]===undefined?Infinity:m[u],p); }); }); return PRICES.map(p=>Object.values(m).filter(w=>w<=p).length); }
function displayDemand(){ const d=correctedDemand().slice(); for(let i=d.length-2;i>=0;i--){ if(d[i]<=d[i+1]) d[i]=d[i+1]+1; } return d; }
function displaySupply(){ const s=correctedSupply().slice(); for(let i=1;i<s.length;i++){ if(s[i]<=s[i-1]) s[i]=s[i-1]+1; } return s; }
function equilibrium(){ const d=displayDemand(), s=displaySupply();
  for(let i=0;i<PRICES.length-1;i++){ const g1=d[i]-s[i], g2=d[i+1]-s[i+1];
    if(g1===0) return {price:PRICES[i], qty:d[i]};
    if(g1>0&&g2<0){ const t=g1/(g1-g2); return {price:Math.round(PRICES[i]+t*(PRICES[i+1]-PRICES[i])), qty:Math.round(d[i]+t*(d[i+1]-d[i]))}; } }
  return null; }

/* 서술형 채점: 수요법칙은 방향이 서로 반대(상승↔감소 / 하락↔증가)면 정답,
   공급법칙은 방향이 서로 같으면(상승↔증가 / 하락↔감소) 정답. 양방향 모두 인정. */
function writtenCorrect(kind, a){
  if(!a||!a.p||!a.q) return false;
  const opposite = (a.p==='상승'&&a.q==='감소')||(a.p==='하락'&&a.q==='증가');
  const same     = (a.p==='상승'&&a.q==='증가')||(a.p==='하락'&&a.q==='감소');
  return kind==='demand' ? opposite : same;
}

function writtenTeacher(kind, revealed){
  const store=respNode(kind==='demand'?'demandWritten':'supplyWritten'); const answers=Object.values(store), n=answers.length;
  let ok=0; answers.forEach(a=>{ if(writtenCorrect(kind,a)) ok++; });
  const target=kind==='demand'?'수요량':'공급량', law=kind==='demand'?'수요 법칙':'공급 법칙';
  const ex1=kind==='demand'?'가격이 <b>상승</b>하면 '+target+'은 <b>감소</b>한다':'가격이 <b>상승</b>하면 '+target+'은 <b>증가</b>한다';
  const ex2=kind==='demand'?'가격이 <b>하락</b>하면 '+target+'은 <b>증가</b>한다':'가격이 <b>하락</b>하면 '+target+'은 <b>감소</b>한다';
  return `<h2 style="text-align:center">✍️ ${kind==='demand'?'2단계':'4단계'}. ${law}을 문장으로!</h2>
    <p class="muted" style="text-align:center">학생들이 제출하고 있어요. 정답은 <b>정답 공개</b> 버튼을 누를 때만 보여요.</p>
    <div class="tally"><div class="tbox t-yes"><div class="n">${ok}</div><div class="l">정답</div></div>
      <div class="tbox t-no"><div class="n">${n-ok}</div><div class="l">오답</div></div>
      <div class="tbox t-wait"><div class="n">${n}</div><div class="l">제출</div></div></div>
    ${revealed?`<div class="sentence" style="text-align:center;background:#e7f6ec;color:#166534;font-size:19px">정답은 두 가지 모두 인정!<br>① ${ex1}<br>② ${ex2}</div>`:''}`;
}

    <p class="muted" style="text-align:center">정답은 <b>정답 공개</b> 버튼을 누를 때만 보여요.</p>

function textList(key){
  const store=(liveData.text||{})[key]||{}; const arr=Object.values(store);
  return `<div class="pill" style="display:block;text-align:center;margin-top:8px">응답 ${arr.length}개</div>
    <div class="resp-list">${arr.map(r=>`<div class="resp"><b>${esc(r.name)}</b> · ${esc(r.text)}</div>`).join('')||'<p class="muted" style="text-align:center">아직 응답이 없어요</p>'}</div>`;

function marketTradeTeacher(){
  const m=liveData.market||{}; const cards=m.cards||{}; const book=m.book||{}; const matched=m.matched||{}; const r=m.round||1;
  const deals=dealsArr(); const thisRound=deals.filter(d=>d.round===r).length;
  const total=Object.keys(cards).filter(id=>id!=='TEACHER').length;
  const buyers=[], sellers=[];
  Object.entries(book).forEach(([id,o])=>{ if(o.round!==r) return; if(matched[id]===r) return;
    (cards[id]&&cards[id].role==='buyer'?buyers:sellers).push({id,...o}); });
  const col=(arr,cls)=>arr.map(o=>`<div class="offer ${cls}"><span class="op">${won(o.price)}</span><span class="om">${esc(o.name||nameOf(o.id))}${o.msg?' · '+esc(o.msg):''}</span></div>`).join('')||'<p class="muted" style="font-size:14px">아직 없어요</p>';
  return `<h2 style="text-align:center">🤝 ${r}라운드 (${r}/${MAX_ROUND}) · <span id="mktTimer" style="font-family:'Black Han Sans',sans-serif">⏱ 대기</span></h2>
    <p class="muted" style="text-align:center">호가를 올린 뒤 서로 수락하면 거래 성사! <b>⏱ ${ROUND_SECONDS}초 시작</b>으로 라운드를 시작하세요.</p>
    <div class="tally"><div class="tbox t-yes"><div class="n">${thisRound}</div><div class="l">이번 라운드 거래</div></div>
      <div class="tbox t-wait"><div class="n">${deals.length}</div><div class="l">누적 거래</div></div>
      <div class="tbox t-no"><div class="n">${total}</div><div class="l">전체 인원</div></div></div>
    <div class="grid2"><div class="book"><b style="color:var(--demand)">🛒 구매자 호가</b>${col(buyers,'buy')}</div>
      <div class="book"><b style="color:var(--supply)">🏪 판매자 호가</b>${col(sellers,'sell')}</div></div>
    ${teacherPlayPanel()}
    <div class="card" style="box-shadow:none;margin-top:10px"><b>🏆 누적 이익 순위</b>${leaderboardHtml(5)}</div>
    <p class="muted" style="text-align:center;font-size:14px">라운드를 넘기려면 <b>⏭ 다음 라운드</b>, 결과를 보려면 <b>다음 →</b></p>`;
}
function marketResultTeacher(){
  const deals=dealsArr();
  if(!deals.length) return `<h2 style="text-align:center">📊 전체 거래 결과표</h2>${look('⏳','아직 거래가 없어요. 이전 화면에서 거래를 진행하세요.')}`;
  const counts={}; deals.forEach(t=>counts[t.price]=(counts[t.price]||0)+1);
  const prices=Object.keys(counts).map(Number).sort((a,b)=>a-b); const maxC=Math.max(...Object.values(counts));
  const modal=prices.filter(p=>counts[p]===maxC);
  let best={name:'-',profit:-Infinity,role:''};
  deals.forEach(t=>{ if(t.bProfit>best.profit) best={name:nameOf(t.buyerId),profit:t.bProfit,role:'구매'}; if(t.sProfit>best.profit) best={name:nameOf(t.sellerId),profit:t.sProfit,role:'판매'}; });
  const bars=prices.map(p=>{ const h=Math.round(counts[p]/maxC*100);
    return `<div class="col ${counts[p]===maxC?'peak':''}"><div class="cnt">${counts[p]}</div><div class="bar" style="height:${h}%"></div><div class="px">${won(p)}</div></div>`; }).join('');
  return `<h2 style="text-align:center">📊 전체 거래 결과표 (치킨)</h2>
    <p class="muted" style="text-align:center">거래가 가장 많이 몰린 <b style="color:var(--ok)">초록 막대</b>가 시장 가격(균형 가격)이에요!</p>
    <div class="hist">${bars}</div>

function studentMarketTrade(){
  const c=myCard(); if(!c) return look('🃏','카드를 기다리는 중…');
  const m=liveData.market||{}; const r=curRound(); const buy=c.role==='buyer';
  if(amMatched()){
    const d=dealsArr().find(x=>x.round===r&&(x.buyerId===sid||x.sellerId===sid));
    const profit=d?(d.buyerId===sid?d.bProfit:d.sProfit):0;
    return `<div class="gamecard ${buy?'gc-buy':'gc-sell'}"><div class="role">🎉 ${r}라운드 거래 성사!</div><div class="val">${d?won(d.price):''}</div><div class="hint">내 이익 <b>${won(profit)}</b> · 다음 라운드를 기다려요</div></div>
      <p class="muted" style="text-align:center">누적 이익: <b>${won(myTotalProfit())}</b></p>`;
  }
  const myOffer=(m.book||{})[sid]; const myValid=myOffer&&myOffer.round===r;

  const opp=Object.entries(m.book||{}).filter(([id,o])=>o.round===r&&matched[id]!==r&&cards[id]&&cards[id].role!==c.role&&id!==sid)
    .map(([id,o])=>({id,...o}));
  const oppRows=opp.map(o=>{ const prof=buy?(c.value-o.price):(o.price-c.value);
    return `<div class="offer ${buy?'sell':'buy'}"><span class="op">${won(o.price)}</span>
      <span class="om">${esc(o.name||nameOf(o.id))}${o.msg?' · "'+esc(o.msg)+'"':''}<br><b style="color:${prof>=0?'var(--ok)':'var(--bad)'}">예상 이익 ${won(prof)}</b></span>
      <button class="btn btn-sm ${prof>=0?'btn-ok':'btn-ghost'}" onclick="requestTrade('${o.id}',${o.price})">거래 요청</button></div>`; }).join('')
    || '<p class="muted" style="font-size:14px;text-align:center">아직 상대 호가가 없어요</p>';
  // 나에게 온 요청
  const reqs=Object.entries((m.requests||{})[sid]||{}).filter(([fid,q])=>q.round===r&&matched[fid]!==r)
    .map(([fid,q])=>`<div class="req"><span class="grow">🔔 <b>${esc(q.name||nameOf(fid))}</b> 님이 <b>${won(q.price)}</b>에 거래 요청</span><button class="btn btn-sm btn-ok" onclick="acceptRequest('${fid}',${q.price})">수락</button></div>`).join('');
  return studentCard('')+`
    <div style="text-align:center;margin:4px 0"><span id="mktTimer" style="font-weight:900;font-size:22px">⏱ 대기</span></div>
    <div id="mktNudge" style="text-align:center;color:var(--bad);font-weight:800;font-size:14px;min-height:18px"></div>
    <div class="grid2" style="margin-top:6px">
      <div><label>${buy?'사고 싶은 가격 (희망 구매가)':'팔고 싶은 가격 (희망 판매가)'}</label>
        <input id="offer" inputmode="numeric" placeholder="1,000원 단위" value="${myValid?myOffer.price:''}" style="text-align:center;font-size:22px"></div>
      <div><label>어필 메시지 (선택)</label>
        <input id="appeal" maxlength="40" placeholder="${buy?'예: 조금만 깎아주세요! 단골 될게요~':'예: 갓 튀긴 치킨! 얼른 사가세요~'}" value="${myValid?esc(myOffer.msg||''):''}"></div></div>
    <div style="height:10px"></div>
    <button class="btn btn-brand btn-big" onclick="submitOffer()">${myValid?'호가 수정':'호가 올리기'}</button>
    ${myValid?'<p class="muted" style="text-align:center;font-size:14px;margin-top:6px">내 호가: '+won(myOffer.price)+' 등록됨</p>':''}
    ${reqs?`<div style="margin-top:14px"><b>📨 나에게 온 거래 요청</b>${reqs}</div>`:''}
    <div style="margin-top:14px"><b>🧾 ${buy?'판매자':'구매자'} 호가창</b> <span class="muted" style="font-size:13px">(마음에 들면 거래 요청!)</span>${oppRows}</div>
    <p class="muted" style="text-align:center;font-size:13px;margin-top:8px">${r}/${MAX_ROUND} 라운드 · 누적 이익 <b>${won(myTotalProfit())}</b></p>`;

function studentMarketResult(){

/* --------- 문장 완성 (조각 채우기) --------- */
const SB_ANSWER = ['줄고','늘어난다','같아지는','균형 가격'];
const SB_POOL   = ['줄고','늘어난다','같아지는','균형 가격','늘고','줄어든다','최고 가격'];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function summarizeBuild(){
  const mine=((liveData.text||{}).summaryBuild||{})[sid];
  if(sbScreen!=='summarize_build'){ sbScreen='summarize_build'; sbSlots=[null,null,null,null]; sbChips=shuffle(SB_POOL); }
  if(mine && mine.done){
    return `<h2 style="text-align:center">✏️ 정리 완성!</h2><div class="sentence" style="text-align:center;background:#e7f6ec;color:#166534">${esc(mine.text)}</div>
      <div class="fb fb-ok">✅ 잘 정리했어요! 🎉</div>
      <button class="btn btn-ghost btn-big" style="margin-top:12px" onclick="sbReset()">다시 해보기</button>`;
  }
  const slot=(i)=> sbSlots[i]?`<span class="slot" onclick="sbClear(${i})">${esc(sbSlots[i])}</span>`:`<span class="slot empty" onclick="sbClear(${i})">＿＿</span>`;
  const chipHtml=sbChips.map(w=>`<span class="chipbtn ${sbSlots.includes(w)?'used':''}" onclick="sbFill('${w}')">${w}</span>`).join('');
  const filled=sbSlots.every(x=>x);
  return `<h2 style="text-align:center">✏️ 오늘 배운 것, 문장으로 완성하기</h2>
    <p class="muted" style="text-align:center">아래 <b>조각을 눌러</b> 빈칸(＿＿)을 채워요. 빈칸을 누르면 지워져요.</p>
    <div class="sentence" style="line-height:2.4">가격이 오르면 수요량은 ${slot(0)}, 공급량은 ${slot(1)}.<br>수요량과 공급량이 ${slot(2)} 지점에서 ${slot(3)}이 정해진다.</div>
    <div class="chips">${chipHtml}</div>
    <button class="btn ${filled?'btn-brand':'btn-ghost'} btn-big" onclick="sbSubmit()">${filled?'제출하기':'빈칸을 모두 채워요'}</button>`;
}
function sbFill(w){ if(sbSlots.includes(w)) return; const i=sbSlots.findIndex(x=>!x); if(i<0){ toast('빈칸이 없어요'); return; } sbSlots[i]=w; renderCurrent(); }
function sbClear(i){ if(sbSlots[i]){ sbSlots[i]=null; renderCurrent(); } }
function sbReset(){ sbSlots=[null,null,null,null]; sbChips=shuffle(SB_POOL); roomRef.child('text/summaryBuild/'+sid).remove(); renderCurrent(); }
function sbSubmit(){
  if(!sbSlots.every(x=>x)){ toast('빈칸을 모두 채워요'); return; }
  const correct = sbSlots.every((w,i)=>w===SB_ANSWER[i]);
  const text=`가격이 오르면 수요량은 ${sbSlots[0]}, 공급량은 ${sbSlots[1]}. 수요량과 공급량이 ${sbSlots[2]} 지점에서 ${sbSlots[3]}이 정해진다.`;
  if(!correct){ toast('조금 달라요! 다시 맞춰볼까요? (힌트: 값 오르면 사려는 건 줄어요)'); return; }
  roomRef.child('text/summaryBuild/'+sid).set({name:sname, text, done:true}); toast('완성! 🎉'); renderCurrent();
}

/* --------- 차트 --------- */
function drawChartIfNeeded(sc){
  const el=document.getElementById('chart'); if(!el){ if(chart){chart.destroy(); chart=null;} return; }
  const isExplain=(sc.t==='price_explain');
  const showD=(sc.t==='demand_curve'||isExplain), showS=(sc.t==='supply_curve'||isExplain);
  const lineD=isExplain||!!shownLine['demand_curve'], lineS=isExplain||!!shownLine['supply_curve'];
  const dD=displayDemand(), dS=displaySupply(); const datasets=[]; let maxX=1;
  if(showD){ maxX=Math.max(maxX,...dD); datasets.push({label:'수요량', data:PRICES.map((p,i)=>({x:dD[i],y:p})), showLine:lineD, borderColor:'#2563eb',backgroundColor:'#2563eb',tension:0,borderWidth:5,pointRadius:8}); }
  if(showS){ maxX=Math.max(maxX,...dS); datasets.push({label:'공급량', data:PRICES.map((p,i)=>({x:dS[i],y:p})), showLine:lineS, borderColor:'#dc2626',backgroundColor:'#dc2626',tension:0,borderWidth:5,pointRadius:8}); }
  if(isExplain){ const eq=equilibrium(); if(eq) datasets.push({label:'균형점 ⭐', data:[{x:eq.qty,y:eq.price}], showLine:false, borderColor:'#16a34a',backgroundColor:'#16a34a',pointRadius:13,pointStyle:'star'}); }
  if(chart) chart.destroy();
  chart=new Chart(el,{type:'line',data:{datasets},options:{responsive:true,animation:{duration:500},
    plugins:{legend:{labels:{font:{size:16},usePointStyle:true}},tooltip:{callbacks:{label:c=>`가격 ${Number(c.parsed.y).toLocaleString('ko')}원 · 수량 ${c.parsed.x}`}}},
    scales:{x:{type:'linear',title:{display:true,text:'수량 (명)',font:{size:15,weight:'bold'}},min:0,suggestedMax:maxX+1,ticks:{stepSize:1,precision:0}},
      y:{type:'linear',title:{display:true,text:'가격 (원)',font:{size:15,weight:'bold'}},min:0,suggestedMax:75000,ticks:{stepSize:10000,callback:v=>Number(v).toLocaleString('ko')}}}}});
}

function exportCSV(){
  const rows=collectRows(); if(!rows.length){ toast('아직 저장할 응답이 없어요'); return; }
  const when=new Date().toLocaleString('ko-KR'); const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const lines=[['시간','PIN','이름','구분','항목','응답'].map(q).join(',')];
  rows.forEach(r=>lines.push([when,pin,r[0],r[1],r[2],r[3]].map(q).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});

  a.href=u; a.download='치킨시장_응답_방'+pin+'.csv'; document.body.appendChild(a); a.click();

      <div class="tbox t-wait"><div class="n">${Math.max(0,arr.length-done)}</div><div class="l">진행 중</div></div>
      <div class="tbox t-no"><div class="n">${arr.length}</div><div class="l">참여</div></div></div>
    <div class="grid2"><div class="card" style="box-shadow:none"><b>🔎 많이 고른 요인</b>${facts}</div>
      <div class="card" style="box-shadow:none"><b>🧾 학생 목록 (눌러서 상세)</b><div class="resp-list">${list}</div></div></div>
    ${detail}`;
}

/* ---------------- 배경음악(BGM) + 음성(TTS) ---------------- */
let prevDealCount=-1;
let bgmCtx=null, bgmOn=false, bgmTimer=null, bgmStep=0;
function bgmToggle(){
  try{ if(!bgmCtx) bgmCtx=new (window.AudioContext||window.webkitAudioContext)(); if(bgmCtx.state==='suspended') bgmCtx.resume(); }catch(e){ return; }
  const btn=document.getElementById('bgmBtn');
  if(bgmOn){ bgmOn=false; clearInterval(bgmTimer); bgmTimer=null; if(btn)btn.textContent='🎵 음악'; return; }
  bgmOn=true; if(btn)btn.textContent='🔇 끄기';
  const mel=[523,659,784,659, 587,740,880,740, 523,659,784,1047, 880,784,659,587];
  const bass=[131,131,165,165, 147,147,196,196];
  const eighth=(60/132)/2; bgmStep=0;
  bgmTimer=setInterval(()=>{ if(!bgmOn||!bgmCtx) return; const t=bgmCtx.currentTime+0.02;
    bgmNote(mel[bgmStep%mel.length], t, 0.16, 0.05, 'triangle');
    if(bgmStep%2===0) bgmNote(bass[(Math.floor(bgmStep/2))%bass.length], t, 0.32, 0.045, 'sine');
    bgmStep++; }, eighth*1000);
}
function bgmNote(freq,t,dur,vol,type){ if(!bgmCtx) return;
  const o=bgmCtx.createOscillator(), g=bgmCtx.createGain(); o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(bgmCtx.destination); o.start(t); o.stop(t+dur+0.05); }
function speak(text){ try{ const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=1.05; u.pitch=1.1; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }

renderLanding();
</script>
