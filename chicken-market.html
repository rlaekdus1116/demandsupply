<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>치킨 시장 - 수요와 공급 (1~4단계)</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#fff7ed; --card:#ffffff; --ink:#1f2937; --sub:#6b7280;
    --brand:#f97316; --brand2:#ea580c; --demand:#2563eb; --supply:#dc2626;
    --ok:#16a34a; --line:#f1e3d3; --soft:#fff1e0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;}
  .wrap{max-width:1100px;margin:0 auto;padding:18px;}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 10px 30px rgba(234,88,12,.08);padding:26px;}
  h1{font-size:26px;margin:0 0 6px;}
  h2{font-size:20px;margin:0 0 12px;}
  .muted{color:var(--sub);}
  .logo{font-size:40px;}
  .btn{border:none;border-radius:14px;padding:16px 22px;font-size:18px;font-weight:800;
    cursor:pointer;transition:.12s transform,.12s filter;}
  .btn:active{transform:translateY(1px)}
  .btn-brand{background:var(--brand);color:#fff}
  .btn-brand:hover{filter:brightness(1.05)}
  .btn-ghost{background:var(--soft);color:var(--brand2)}
  .btn-dark{background:#111827;color:#fff}
  .btn-big{width:100%;padding:26px;font-size:24px;border-radius:18px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .grow{flex:1}
  input,select{font-size:18px;padding:14px;border:2px solid var(--line);border-radius:12px;width:100%;
    font-family:inherit;background:#fff}
  input:focus,select:focus{outline:none;border-color:var(--brand)}
  label{font-weight:700;font-size:14px;color:var(--sub);display:block;margin-bottom:6px}
  .pin{font-size:64px;font-weight:900;letter-spacing:10px;color:var(--brand2);text-align:center;
    background:var(--soft);border-radius:16px;padding:16px 8px;margin:8px 0}
  .pill{display:inline-block;background:var(--soft);color:var(--brand2);border-radius:999px;
    padding:6px 14px;font-weight:800;font-size:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tally{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:16px 0}
  .tbox{border-radius:16px;padding:18px;text-align:center}
  .tbox .n{font-size:52px;font-weight:900;line-height:1}
  .tbox .l{font-weight:800;margin-top:6px}
  .t-yes{background:#e7f6ec;color:var(--ok)}
  .t-no{background:#fdeaea;color:var(--supply)}
  .t-wait{background:#f3f4f6;color:var(--sub)}
  .price-big{font-size:64px;font-weight:900;color:var(--brand2);text-align:center;margin:10px 0}
  .students{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{background:var(--soft);border-radius:999px;padding:8px 14px;font-weight:700}
  .stepbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
  .stepbar .prog{height:10px;background:var(--line);border-radius:999px;flex:1;overflow:hidden}
  .stepbar .prog>i{display:block;height:100%;background:var(--brand);transition:.3s width}
  .nav{display:flex;gap:12px;margin-top:20px}
  .blank{display:inline-block;min-width:120px;text-align:center;border-bottom:3px solid var(--brand);
    color:var(--brand2);font-weight:900}
  .sentence{font-size:26px;line-height:2;background:var(--soft);border-radius:16px;padding:22px;margin:10px 0}
  .hidden{display:none!important}
  .bars{display:flex;align-items:flex-end;gap:16px;height:170px;margin:14px 0;padding:0 10px}
  .bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
  .bars .b .fill{width:100%;border-radius:10px 10px 0 0;transition:.3s height}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:#111827;color:#fff;padding:14px 22px;border-radius:999px;font-weight:800;
    box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:50}
  .big-instruct{font-size:30px;font-weight:900;text-align:center;margin:30px 0}
  .look{font-size:22px;text-align:center;color:var(--sub);padding:40px 10px}
  .look .emoji{font-size:60px;display:block;margin-bottom:12px}
  .cardtag{position:fixed;top:12px;right:12px;font-size:12px;background:#111827;color:#fff;
    padding:6px 12px;border-radius:999px;z-index:40;opacity:.85}
  a{color:var(--brand2)}
  .warn{background:#fff4e5;border:1px solid #ffd8a8;border-radius:12px;padding:14px;color:#9a5b00;font-size:14px}
  canvas{max-width:100%}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}.price-big{font-size:48px}.pin{font-size:48px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="tag" class="cardtag hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* =========================================================================
   치킨 시장 — 수요와 공급 실시간 수업 웹앱 (1~4단계)
   ---------------------------------------------------------------------------
   [ Firebase 설정 ]  아래 FIREBASE_CONFIG 값을 선생님의 Firebase 프로젝트
   설정값으로 바꾸세요. (README 참고)  키를 바꾸지 않으면 첫 화면에서
   "설정" 버튼으로 임시 입력도 가능합니다(이 기기에서만 저장됨).
   ========================================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyChEuuawdgNznSb8FzByP98GhTEzq_hAdo",
  authDomain: "demandsupply-b961c.firebaseapp.com",
  databaseURL: "https://demandsupply-b961c-default-rtdb.firebaseio.com",
  projectId: "demandsupply-b961c",
  storageBucket: "demandsupply-b961c.firebasestorage.app",
  messagingSenderId: "475624406832",
  appId: "1:475624406832:web:cef84e906a88aa574d12f5",
  measurementId: "G-5LCN6XJVX6"
};

const PRICES = [5000, 15000, 30000, 50000, 70000];   // 치킨 1마리 가격
const won = n => n.toLocaleString('ko-KR') + '원';

/* ---- 화면(스텝) 시퀀스: 교사가 앞뒤로 이동. 학생/교사 공유 인덱스 ---- */
const SCREENS = [
  {t:'lobby'},
  {t:'demand_intro'},
  ...PRICES.map(p=>({t:'demand_price', price:p})),
  {t:'demand_curve'},
  {t:'demand_written'},
  {t:'supply_intro'},
  ...PRICES.map(p=>({t:'supply_price', price:p})),
  {t:'supply_curve'},
  {t:'supply_written'},
  {t:'both_curve'},
  {t:'end'}
];

/* ------------------------------ 상태 ------------------------------ */
let db=null, role=null, pin=null, sid=null, sname=null;
let roomRef=null, unsub=[], liveData={}, chart=null, lastScreenIndex=-1;

/* 이 기기의 학생 고유 id (새로고침해도 유지) */
sid = localStorage.getItem('cm_sid');
if(!sid){ sid = 'u'+Math.random().toString(36).slice(2,9); localStorage.setItem('cm_sid', sid); }

const $ = s => document.querySelector(s);
const app = $('#app');
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add('hidden'),1600); }

/* ---------------------- Firebase 초기화 ---------------------- */
function getConfig(){
  const saved = localStorage.getItem('cm_fbconfig');
  if(saved){ try{ return JSON.parse(saved); }catch(e){} }
  return FIREBASE_CONFIG;
}
function isConfigured(cfg){ return cfg && cfg.databaseURL && !cfg.databaseURL.includes('PASTE_YOUR'); }
function initFirebase(){
  const cfg = getConfig();
  if(!isConfigured(cfg)) return false;
  if(!firebase.apps.length) firebase.initializeApp(cfg);
  db = firebase.database();
  return true;
}

/* =======================================================================
   랜딩 화면
   ======================================================================= */
function renderLanding(){
  const configured = isConfigured(getConfig());
  app.innerHTML = `
  <div class="center wrap">
    <div class="card" style="max-width:460px;width:100%;text-align:center">
      <div class="logo">🍗</div>
      <h1>치킨 시장</h1>
      <p class="muted">수요와 공급의 원리를 직접 만들어 봐요<br>(1~4단계)</p>
      ${configured?'':`<div class="warn" style="text-align:left;margin:14px 0">
        ⚠ Firebase 설정이 아직 없어요. 실시간 접속을 하려면
        <b>설정</b>에서 키를 넣거나 파일의 <code>FIREBASE_CONFIG</code>를 바꾸세요.</div>`}
      <div style="height:10px"></div>
      <button class="btn btn-brand btn-big" onclick="chooseRole('teacher')">👩‍🏫 선생님으로 시작</button>
      <div style="height:12px"></div>
      <button class="btn btn-ghost btn-big" onclick="chooseRole('student')">🙋 학생으로 참여</button>
      <div style="height:16px"></div>
      <button class="btn btn-ghost" style="font-size:14px;padding:10px 16px" onclick="renderConfig()">⚙️ Firebase 설정</button>
    </div>
    <p class="muted" style="margin-top:16px;font-size:13px">같은 방 번호(PIN)로 선생님과 학생이 연결됩니다.</p>
  </div>`;
}

function renderConfig(){
  const cur = getConfig();
  app.innerHTML = `
  <div class="center wrap">
    <div class="card" style="max-width:560px;width:100%">
      <h2>⚙️ Firebase 설정</h2>
      <p class="muted" style="font-size:14px">Firebase 콘솔 → 프로젝트 설정 → "내 앱"의 config 객체를 붙여넣으세요.
        <br>(다기기 수업이라면 파일의 <code>FIREBASE_CONFIG</code>에 직접 넣어 배포하는 것이 가장 확실합니다.)</p>
      <label>Firebase config (JSON)</label>
      <textarea id="cfgin" style="width:100%;height:180px;font-family:monospace;font-size:13px;border:2px solid var(--line);border-radius:12px;padding:12px">${JSON.stringify(isConfigured(cur)?cur:{apiKey:"",authDomain:"",databaseURL:"",projectId:""},null,2)}</textarea>
      <div class="nav">
        <button class="btn btn-brand grow" onclick="saveConfig()">저장</button>
        <button class="btn btn-ghost" onclick="renderLanding()">뒤로</button>
      </div>
    </div>
  </div>`;
}
function saveConfig(){
  try{
    const obj = JSON.parse($('#cfgin').value.replace(/,\s*}/g,'}'));
    localStorage.setItem('cm_fbconfig', JSON.stringify(obj));
    toast('설정을 저장했어요');
    renderLanding();
  }catch(e){ toast('JSON 형식을 확인해주세요'); }
}

function chooseRole(r){
  if(!initFirebase()){ toast('먼저 Firebase 설정이 필요해요'); renderConfig(); return; }
  role = r;
  if(r==='teacher') startTeacher();
  else renderStudentJoin();
}

/* =======================================================================
   교사: 방 생성 & 진행
   ======================================================================= */
function startTeacher(){
  pin = String(Math.floor(1000 + Math.random()*9000));
  roomRef = db.ref('rooms/'+pin);
  roomRef.child('screenIndex').set(0);
  roomRef.child('meta').set({createdAt: Date.now()});
  subscribeRoom();
  $('#tag').textContent = '선생님 · 방 '+pin; $('#tag').classList.remove('hidden');
}

function subscribeRoom(){
  const ref = roomRef;
  const onVal = (path,key) => ref.child(path).on('value', s=>{ liveData[key]=s.val()||{}; renderCurrent(); });
  onVal('screenIndex','screenIndexRaw');
  ref.child('screenIndex').on('value', s=>{ liveData.screenIndex = s.val()||0; renderCurrent(); });
  onVal('students','students');
  onVal('responses/demand','demand');
  onVal('responses/supply','supply');
  onVal('responses/demandWritten','demandWritten');
  onVal('responses/supplyWritten','supplyWritten');
}

function teacherGo(delta){
  const idx = Math.max(0, Math.min(SCREENS.length-1, (liveData.screenIndex||0)+delta));
  roomRef.child('screenIndex').set(idx);
}

/* =======================================================================
   학생: 참여
   ======================================================================= */
function renderStudentJoin(){
  app.innerHTML = `
  <div class="center wrap">
    <div class="card" style="max-width:420px;width:100%;text-align:center">
      <div class="logo">🙋</div>
      <h1>학생 참여</h1>
      <div style="height:10px"></div>
      <label style="text-align:left">방 번호 (PIN)</label>
      <input id="pinin" inputmode="numeric" maxlength="4" placeholder="숫자 4자리" style="text-align:center;font-size:28px;letter-spacing:8px">
      <div style="height:12px"></div>
      <label style="text-align:left">이름</label>
      <input id="namein" placeholder="이름을 입력하세요">
      <div style="height:16px"></div>
      <button class="btn btn-brand btn-big" onclick="studentJoin()">입장하기</button>
      <div style="height:12px"></div>
      <button class="btn btn-ghost" style="font-size:14px" onclick="renderLanding()">뒤로</button>
    </div>
  </div>`;
}
function studentJoin(){
  const p = ($('#pinin').value||'').trim();
  const nm = ($('#namein').value||'').trim();
  if(p.length!==4){ toast('방 번호 4자리를 입력하세요'); return; }
  if(!nm){ toast('이름을 입력하세요'); return; }
  pin=p; sname=nm; roomRef = db.ref('rooms/'+pin);
  roomRef.child('meta').get().then(snap=>{
    if(!snap.exists()){ toast('없는 방 번호예요'); return; }
    roomRef.child('students/'+sid).set({name:nm, joinedAt:Date.now()});
    roomRef.child('screenIndex').on('value', s=>{ liveData.screenIndex=s.val()||0; renderCurrent(); });
    // 학생도 자신의 제출 여부 확인용으로 응답 구독
    roomRef.child('responses').on('value', s=>{ liveData.responses=s.val()||{}; renderCurrent(); });
    $('#tag').textContent = nm+' · 방 '+pin; $('#tag').classList.remove('hidden');
  });
}

/* =======================================================================
   학생 응답 쓰기
   ======================================================================= */
function studentAnswerPrice(kind, price, val){
  roomRef.child('responses/'+kind+'/'+price+'/'+sid).set(val);
  toast(val?'"살래요/팔래요" 제출!':'"안 할래요" 제출!');
}
function studentWritten(kind, pKey, qKey){
  const p = $('#w_p').value, q = $('#w_q').value;
  if(!p||!q){ toast('빈칸을 모두 선택하세요'); return; }
  roomRef.child('responses/'+kind+'/'+sid).set({p, q});
  toast('제출 완료!');
}

/* =======================================================================
   집계 & 왜곡 보정
   ---------------------------------------------------------------------
   수요: 학생의 '최대 지불 의사가격' = 살겠다고 한 가장 높은 가격.
         그 학생은 그보다 낮은 모든 가격에서도 산다고 본다.
         → 가격 P의 수요량 = (최대지불가 ≥ P) 인 학생 수  → 우하향 보장
   공급: 학생의 '최소 판매 수용가격' = 팔겠다고 한 가장 낮은 가격.
         그보다 높은 모든 가격에서도 판다고 본다.
         → 가격 P의 공급량 = (최소판매가 ≤ P) 인 학생 수  → 우상향 보장
   ======================================================================= */
function rawCounts(kind){ // {price: {yes, no}}
  const data = liveData[kind]||{};
  const out={};
  PRICES.forEach(p=>{
    const at = data[p]||{}; let yes=0,no=0;
    Object.values(at).forEach(v=> v?yes++:no++);
    out[p]={yes,no};
  });
  return out;
}
function correctedDemand(){
  const data = liveData.demand||{};
  // 학생별 최대 지불 가격
  const maxWTP = {};
  PRICES.forEach(p=>{ const at=data[p]||{};
    Object.entries(at).forEach(([u,v])=>{ if(v){ maxWTP[u]=Math.max(maxWTP[u]||0, p); } }); });
  return PRICES.map(p=> Object.values(maxWTP).filter(w=> w>=p).length );
}
function correctedSupply(){
  const data = liveData.supply||{};
  const minAsk = {};
  PRICES.forEach(p=>{ const at=data[p]||{};
    Object.entries(at).forEach(([u,v])=>{ if(v){ minAsk[u]=Math.min(minAsk[u]||Infinity, p); } }); });
  return PRICES.map(p=> Object.values(minAsk).filter(w=> w<=p).length );
}

/* =======================================================================
   렌더링
   ======================================================================= */
function renderCurrent(){
  const idx = liveData.screenIndex||0;
  const sc = SCREENS[idx];
  if(role==='teacher') renderTeacher(sc, idx);
  else renderStudent(sc, idx);
  lastScreenIndex = idx;
}

function progressBar(idx){
  const pct = Math.round(idx/(SCREENS.length-1)*100);
  return `<div class="stepbar">
      <span class="pill">방 ${pin}</span>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <span class="muted" style="font-size:13px">${idx+1}/${SCREENS.length}</span>
    </div>`;
}
function teacherNav(){
  return `<div class="nav">
    <button class="btn btn-ghost" onclick="teacherGo(-1)">← 이전</button>
    <button class="btn btn-brand grow" onclick="teacherGo(1)">다음 →</button>
  </div>`;
}

/* --------------------------- 교사 화면 --------------------------- */
function renderTeacher(sc, idx){
  const nStudents = Object.keys(liveData.students||{}).length;
  let body='';
  if(sc.t==='lobby'){
    const names = Object.values(liveData.students||{}).map(s=>s.name);
    body = `<div style="text-align:center">
      <h2>학생들을 기다리는 중…</h2>
      <p class="muted">학생들에게 아래 방 번호를 알려주세요</p>
      <div class="pin">${pin}</div>
      <div class="pill">참여 ${nStudents}명</div>
      <div class="students" style="justify-content:center">${names.map(n=>`<span class="chip">${esc(n)}</span>`).join('')||'<span class="muted">아직 없어요</span>'}</div>
    </div>`;
  }
  else if(sc.t==='demand_intro'){
    body = introBlock('🍗 1단계. 수요의 법칙 찾기','치킨 1마리를 <b>살지 말지</b> 가격마다 정해볼 거예요.<br>가격이 오르면 사려는 사람은 어떻게 될까요?','demand');
  }
  else if(sc.t==='supply_intro'){
    body = introBlock('🏪 3단계. 공급의 법칙 찾기','여러분은 이제 <b>치킨 가게 사장님</b>! 원가는 한 마리 <b>'+won(9000)+'</b>이에요.<br>이 가격에 <b>팔지 말지</b> 정해볼 거예요.','supply');
  }
  else if(sc.t==='demand_price' || sc.t==='supply_price'){
    const kind = sc.t==='demand_price'?'demand':'supply';
    const c = rawCounts(kind)[sc.price];
    const wait = Math.max(0, nStudents - c.yes - c.no);
    const verb = kind==='demand'?'살까요?':'팔까요?';
    const role2 = kind==='demand'?'':'<span class="muted" style="font-size:16px">(원가 '+won(9000)+')</span>';
    body = `<h2 style="text-align:center">${kind==='demand'?'🍗 치킨 1마리, 이 가격이면':'🏪 사장님, 이 가격에'} ${verb} ${role2}</h2>
      <div class="price-big">${won(sc.price)}</div>
      <div class="tally">
        <div class="tbox t-yes"><div class="n">${c.yes}</div><div class="l">${kind==='demand'?'👍 살래요':'👍 팔래요'}</div></div>
        <div class="tbox t-no"><div class="n">${c.no}</div><div class="l">✋ 안 할래요</div></div>
        <div class="tbox t-wait"><div class="n">${wait}</div><div class="l">⏳ 미응답</div></div>
      </div>
      <p class="muted" style="text-align:center">모두 응답하면 <b>다음 →</b> 을 눌러 다음 가격으로 넘어가세요.</p>`;
  }
  else if(sc.t==='demand_curve'){
    body = `<h2 style="text-align:center">📉 우리 반 수요 곡선</h2>
      <p class="muted" style="text-align:center">가격이 오를수록 사려는 양(수요량)이 줄어드는 걸 확인해요. (장난 응답은 자동 보정)</p>
      <canvas id="chart" height="320"></canvas>`;
  }
  else if(sc.t==='supply_curve'){
    body = `<h2 style="text-align:center">📈 우리 반 공급 곡선</h2>
      <p class="muted" style="text-align:center">가격이 오를수록 팔려는 양(공급량)이 늘어나는 걸 확인해요.</p>
      <canvas id="chart" height="320"></canvas>`;
  }
  else if(sc.t==='both_curve'){
    body = `<h2 style="text-align:center">⚖️ 수요와 공급이 만나면?</h2>
      <p class="muted" style="text-align:center">두 곡선이 만나는 곳이 바로 다음 시간에 배울 <b>균형</b>이에요!</p>
      <canvas id="chart" height="320"></canvas>`;
  }
  else if(sc.t==='demand_written' || sc.t==='supply_written'){
    body = writtenTeacher(sc.t==='demand_written'?'demand':'supply');
  }
  else if(sc.t==='end'){
    body = `<div style="text-align:center;padding:20px">
      <div class="logo">🎉</div>
      <h2>1~4단계 끝!</h2>
      <p class="muted">수요 법칙과 공급 법칙을 우리 손으로 만들었어요.<br>다음 시간엔 모의 시장 게임으로 <b>균형 가격</b>을 찾아봐요.</p>
    </div>`;
  }

  app.innerHTML = `<div class="wrap"><div class="card">${progressBar(idx)}${body}${teacherNav()}</div></div>`;
  drawChartIfNeeded(sc);
}

function introBlock(title, desc, kind){
  const c = kind==='demand'?'var(--demand)':'var(--supply)';
  return `<div style="text-align:center;padding:14px">
    <h1 style="color:${c}">${title}</h1>
    <p style="font-size:22px;margin-top:16px">${desc}</p>
    <p class="muted" style="margin-top:20px">준비됐으면 <b>다음 →</b></p>
  </div>`;
}

function writtenTeacher(kind){
  const store = liveData[kind==='demand'?'demandWritten':'supplyWritten']||{};
  const answers = Object.values(store);
  const n = answers.length;
  // 집계
  const pCount = {상승:0, 하락:0}, qCount = {증가:0, 감소:0};
  answers.forEach(a=>{ if(a.p in pCount)pCount[a.p]++; if(a.q in qCount)qCount[a.q]++; });
  const correctP = '상승';
  const correctQ = kind==='demand' ? '감소' : '증가';
  const target = kind==='demand'?'수요량':'공급량';
  const law = kind==='demand'?'수요 법칙':'공급 법칙';
  return `<h2 style="text-align:center">✍️ ${kind==='demand'?'2단계':'4단계'}. ${law}을 문장으로!</h2>
    <div class="sentence" style="text-align:center">
      가격이 <span class="blank">[상승]</span> 하면, ${target}은 <span class="blank">[?]</span> 한다.
    </div>
    <div class="grid2">
      <div class="card" style="box-shadow:none">
        <b>가격은?</b>
        ${barRow('상승',pCount.상승,n,correctP==='상승')}
        ${barRow('하락',pCount.하락,n,correctP==='하락')}
      </div>
      <div class="card" style="box-shadow:none">
        <b>${target}은?</b>
        ${barRow('증가',qCount.증가,n,correctQ==='증가')}
        ${barRow('감소',qCount.감소,n,correctQ==='감소')}
      </div>
    </div>
    <p class="muted" style="text-align:center;margin-top:10px">제출 ${n}명 · 초록색이 정답이에요</p>
    <div class="sentence" style="text-align:center;background:#e7f6ec;color:#166534;font-size:22px">
      정답: 가격이 <b>상승</b>하면, ${target}은 <b>${correctQ}</b>한다.
    </div>`;
}
function barRow(label,count,total,correct){
  const pct = total?Math.round(count/total*100):0;
  return `<div style="margin:10px 0">
    <div style="display:flex;justify-content:space-between;font-weight:700">
      <span>${label} ${correct?'✅':''}</span><span>${count}명</span></div>
    <div class="prog" style="height:14px;margin-top:4px"><i style="width:${pct}%;background:${correct?'var(--ok)':'var(--brand)'}"></i></div>
  </div>`;
}

/* --------------------------- 학생 화면 --------------------------- */
function renderStudent(sc, idx){
  let body='';
  const myResp = (kind,price)=>{
    const r = ((liveData.responses||{})[kind]||{})[price]||{};
    return sid in r ? r[sid] : null;
  };
  if(sc.t==='lobby'){
    body = look('⏳','입장 완료! 선생님이 시작하기를 기다려요.');
  }
  else if(sc.t==='demand_intro'||sc.t==='supply_intro'){
    body = look(sc.t==='demand_intro'?'🍗':'🏪',
      sc.t==='demand_intro'?'지금부터 치킨을 <b>살지 말지</b> 정할 거예요!':'이제 <b>치킨 가게 사장님</b>이에요. 원가는 '+won(9000)+'!');
  }
  else if(sc.t==='demand_price'||sc.t==='supply_price'){
    const kind = sc.t==='demand_price'?'demand':'supply';
    const mine = myResp(kind, sc.price);
    const yesLabel = kind==='demand'?'👍 살래요':'👍 팔래요';
    const q = kind==='demand'?'이 가격이면 치킨을 살래요?':'이 가격에 치킨을 팔래요? (원가 '+won(9000)+')';
    body = `<h2 style="text-align:center">${q}</h2>
      <div class="price-big">${won(sc.price)}</div>
      <button class="btn btn-big" style="background:${mine===true?'var(--ok)':'#e7f6ec'};color:${mine===true?'#fff':'var(--ok)'}"
        onclick="studentAnswerPrice('${kind}',${sc.price},true)">${yesLabel}</button>
      <div style="height:12px"></div>
      <button class="btn btn-big" style="background:${mine===false?'var(--supply)':'#fdeaea'};color:${mine===false?'#fff':'var(--supply)'}"
        onclick="studentAnswerPrice('${kind}',${sc.price},false)">✋ 안 할래요</button>
      <p class="muted" style="text-align:center;margin-top:14px">${mine===null?'하나를 골라주세요':'제출됨! 바꾸려면 다시 누르세요'}</p>`;
  }
  else if(sc.t==='demand_curve'||sc.t==='supply_curve'||sc.t==='both_curve'){
    body = look('👀','선생님 화면(칠판)을 봐주세요!<br>우리 반 곡선이 그려지고 있어요.');
  }
  else if(sc.t==='demand_written'||sc.t==='supply_written'){
    const kind = sc.t==='demand_written'?'demand':'supply';
    const store = (liveData.responses||{})[kind==='demand'?'demandWritten':'supplyWritten']||{};
    const mine = store[sid];
    const target = kind==='demand'?'수요량':'공급량';
    body = `<h2 style="text-align:center">✍️ 문장을 완성해요</h2>
      <div class="sentence" style="font-size:22px;text-align:center">
        가격이
        <select id="w_p" style="width:auto;display:inline-block">
          <option value="">▼</option>
          <option ${mine&&mine.p==='상승'?'selected':''}>상승</option>
          <option ${mine&&mine.p==='하락'?'selected':''}>하락</option>
        </select>
        하면,<br>${target}은
        <select id="w_q" style="width:auto;display:inline-block">
          <option value="">▼</option>
          <option ${mine&&mine.q==='증가'?'selected':''}>증가</option>
          <option ${mine&&mine.q==='감소'?'selected':''}>감소</option>
        </select>
        한다.
      </div>
      <button class="btn btn-brand btn-big" onclick="studentWritten('${kind==='demand'?'demandWritten':'supplyWritten'}')">${mine?'다시 제출':'제출하기'}</button>
      ${mine?'<p class="muted" style="text-align:center;margin-top:10px">제출 완료 ✅</p>':''}`;
  }
  else if(sc.t==='end'){
    body = look('🎉','수고했어요! 오늘 수요·공급 법칙을 직접 만들었어요.');
  }
  app.innerHTML = `<div class="wrap"><div class="card">${body}</div></div>`;
}
function look(emoji,txt){ return `<div class="look"><span class="emoji">${emoji}</span>${txt}</div>`; }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* --------------------------- 차트 --------------------------- */
function drawChartIfNeeded(sc){
  const el = document.getElementById('chart');
  if(!el) { if(chart){chart.destroy(); chart=null;} return; }
  const demand = correctedDemand();
  const supply = correctedSupply();
  const datasets=[];
  if(sc.t==='demand_curve'||sc.t==='both_curve'){
    datasets.push({label:'수요량', data:PRICES.map((p,i)=>({x:demand[i], y:p})),
      borderColor:'#2563eb', backgroundColor:'#2563eb', tension:.2, borderWidth:4, pointRadius:6});
  }
  if(sc.t==='supply_curve'||sc.t==='both_curve'){
    datasets.push({label:'공급량', data:PRICES.map((p,i)=>({x:supply[i], y:p})),
      borderColor:'#dc2626', backgroundColor:'#dc2626', tension:.2, borderWidth:4, pointRadius:6});
  }
  if(chart){ chart.destroy(); }
  chart = new Chart(el, {
    type:'line',
    data:{datasets},
    options:{
      responsive:true, animation:{duration:400},
      plugins:{legend:{labels:{font:{size:16}}}},
      scales:{
        x:{title:{display:true,text:'수량(명)',font:{size:15}}, min:0, ticks:{stepSize:1, precision:0}},
        y:{title:{display:true,text:'가격(원)',font:{size:15}},
           ticks:{callback:v=>v.toLocaleString('ko')}}
      }
    }
  });
}

renderLanding();
